name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/repo_integrity_check.py
      - run: go install github.com/zricethezav/gitleaks/v8@latest
      - run: gitleaks detect --verbose --redact

  build:
    runs-on: ubuntu-latest
    needs: [go-quality, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t angel-control-plane .
