name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tooling
        run: python -m pip install --upgrade pip setuptools

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Bandit
        run: bandit -q -r src

      - name: Pytest
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml --cov-fail-under=80

      - name: Compile check
        run: python -m compileall -q src

      - name: Container build
        run: docker build --tag angel-control-plane:ci .

      - name: Secret scan
        run: detect-secrets scan --all-files --force-use-all-plugins

      - name: Dependency scan
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Source artifact check
        run: |
          python -m compileall -q src
          test -f Dockerfile
          test -f docker-compose.yml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angel-ci-diagnostics
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
