name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./src/...
      - run: go build ./src/...
      - run: go test ./src/...
      - run: go test ./lab/services/fixture-http/...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/repo_integrity_check.py
      - run: python3 scripts/validate_safe_contracts.py
      - run: python3 scripts/validate_lab_agent_contract.py
      - run: python3 scripts/static_success_checker.py
      - run: bash -n deploy/scripts/deploy.sh deploy/scripts/destroy.sh deploy/scripts/validate.sh
      - run: go install github.com/zricethezav/gitleaks/v8@latest
      - run: gitleaks detect --verbose --redact

  build:
    runs-on: ubuntu-latest
    needs: [go-quality, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t angel-control-plane .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend-angular/package-lock.json
      - run: npm ci --prefix apps/frontend-angular --no-audit --no-fund
      - run: npm run build --prefix apps/frontend-angular
