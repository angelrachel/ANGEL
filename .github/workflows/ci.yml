name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy src/
      - run: bandit -r src/
      - run: pytest tests/

  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: go install github.com/zricethezav/gitleaks/v8@latest
      - run: gitleaks detect --verbose --redact

  build:
    runs-on: ubuntu-latest
    needs: [python-quality, go-quality, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t angel-blackhat .
      - run: docker run --rm angel-blackhat python -c "import src; print('OK')"
