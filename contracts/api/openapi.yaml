openapi: 3.0.3
info:
  title: ANGEL Authorized Security Validation API
  version: 1.0.0
  description: Typed control-plane API for authorized, scoped, non-destructive security validation.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': { description: Service health }
  /readyz:
    get:
      security: []
      summary: Readiness probe
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
  /metrics:
    get:
      security: []
      summary: Operational request metrics
      responses:
        '200': { description: Metrics snapshot }
  /api/v1/modules:
    get:
      summary: List registered ANGEL modules
      responses:
        '200': { description: Module catalog }
        '401': { description: Authentication required }
  /api/v1/platform:
    get:
      summary: Return ANGEL platform manifest and safety boundary
      responses:
        '200': { description: Platform identity, layer count, and denied capabilities }
        '401': { description: Authentication required }
  /api/v1/reports/artifact:
    get:
      summary: Render a stored report as JSON, Markdown, or HTML
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [json, markdown, html] } }
      responses:
        '200': { description: Rendered report artifact with SHA-256 response header }
        '400': { description: Unsupported format }
        '404': { description: Report not found }
  /api/v1/checks:
    get:
      summary: List executable assessment checks
      responses:
        '200': { description: Check registry }
        '401': { description: Authentication required }
    post:
      summary: Evaluate one registered assessment check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckEvaluationRequest'
      responses:
        '200': { description: Check result }
        '400': { description: Invalid evaluation contract }
        '404': { description: Check not found }
        '401': { description: Authentication required }
  /api/v1/engagements:
    post:
      summary: Register an authorized engagement and scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementRegistration'
      responses:
        '201': { description: Engagement registered }
        '400': { description: Invalid authorization or scope }
        '401': { description: Authentication required }
  /api/v1/assessment-jobs:
    post:
      summary: Create a signed, policy-gated assessment job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentJobRequest'
      responses:
        '202': { description: Assessment job accepted }
        '403': { description: Scope, policy, time-window, or budget denied }
        '401': { description: Authentication required }
  /api/v1/jobs:
    get:
      summary: List signed assessment jobs
      parameters:
        - { name: engagement_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Durable filtered and paginated job state }
        '401': { description: Authentication required }
  /api/v1/executions:
    post:
      summary: Run one policy-approved safe adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '201': { description: Execution, evidence, and finding created }
        '403': { description: Adapter or target policy denied }
        '404': { description: Job not found }
  /api/v1/findings:
    get:
      summary: List generated findings
      parameters:
        - { name: severity, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: minimum_confidence, in: query, schema: { type: number, format: float, minimum: 0, maximum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Finding list }
        '401': { description: Authentication required }
  /api/v1/evidence:
    get:
      summary: List redacted evidence manifests
      responses:
        '200': { description: Evidence manifests }
        '401': { description: Authentication required }
  /api/v1/remediations:
    get:
      summary: List remediation plans
      responses:
        '200': { description: Remediation list }
        '401': { description: Authentication required }
    post:
      summary: Create a remediation plan for a finding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationRequest'
      responses:
        '201': { description: Remediation created }
        '400': { description: Invalid remediation contract }
    patch:
      summary: Transition remediation status
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, IN_PROGRESS, READY_FOR_RETEST, CLOSED] }
      responses:
        '200': { description: Remediation updated }
        '409': { description: Invalid transition }
  /api/v1/remediations/retest:
    post:
      summary: Record a remediation retest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remediation_id, evidence_id, passed]
              properties:
                remediation_id: { type: string }
                evidence_id: { type: string }
                notes: { type: string }
                passed: { type: boolean }
      responses:
        '201': { description: Retest recorded }
        '409': { description: Remediation is not ready for retest }
  /api/v1/reports:
    get:
      summary: List integrity-protected reports
      responses:
        '200': { description: Report list }
    post:
      summary: Generate an integrity-protected report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '201': { description: Report generated }
  /api/v1/audit:
    get:
      summary: List hash-chained audit events
      responses:
        '200': { description: Audit chain }
  /api/v1/snapshot:
    get:
      summary: Export a signed redacted operational snapshot
      responses:
        '200': { description: Snapshot and verification public key }
        '401': { description: Authentication required }
  /api/v1/snapshot/validate:
    post:
      summary: Validate a signed snapshot before restore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot, public_key]
              properties:
                snapshot: { type: object }
                public_key: { type: string }
      responses:
        '200': { description: Snapshot validated }
        '409': { description: Snapshot rejected }
  /api/v1/reports/export:
    get:
      summary: Export a report as JSON or Markdown
      parameters:
        - { name: report_id, in: query, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json, markdown], default: json } }
      responses:
        '200': { description: Report export }
        '404': { description: Report not found }
  /api/v1/audit/verify:
    get:
      summary: Verify the audit hash chain
      responses:
        '200': { description: Audit verification result }
  /v1/simulation/tasks:
    post:
      summary: Submit a fixture-backed compatibility simulation task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../task/task.schema.json'
      responses:
        '202': { description: Simulation accepted }
        '400': { description: Invalid contract }
        '403': { description: Scope or approval denied }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Engagement:
      type: object
      required: [id, name, organization_id, authorized, starts_at, ends_at]
      properties:
        id: { type: string }
        name: { type: string }
        organization_id: { type: string }
        authorized: { type: boolean }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        policy_hash: { type: string }
        stopped: { type: boolean }
    ScopeEntry:
      type: object
      required: [id, engagement_id, kind, value, actions]
      properties:
        id: { type: string }
        engagement_id: { type: string }
        kind: { type: string, enum: [fixture, hostname, url, cidr] }
        value: { type: string }
        actions: { type: array, items: { type: string } }
        excluded: { type: boolean }
    EngagementRegistration:
      type: object
      required: [engagement, scope, budget]
      properties:
        engagement: { $ref: '#/components/schemas/Engagement' }
        scope: { type: array, items: { $ref: '#/components/schemas/ScopeEntry' } }
        budget: { type: integer, minimum: 1 }
    AssessmentJobRequest:
      type: object
      required: [engagement_id, task_type, target, action]
      properties:
        engagement_id: { type: string }
        task_type: { type: string }
        target: { type: string }
        action: { type: string }
    CheckEvaluationRequest:
      type: object
      required: [check_id, input]
      properties:
        check_id: { type: string }
        input:
          type: object
          required: [id, target]
          properties:
            id: { type: string }
            target: { type: string }
            headers: { type: object, additionalProperties: { type: string } }
            status_code: { type: integer }
            body: { type: string }
            metadata: { type: object, additionalProperties: { type: string } }
    ExecutionRequest:
      type: object
      required: [job_id, target, check_id]
      properties:
        job_id: { type: string }
        target: { type: string }
        check_id: { type: string }
        fixture: { type: object, additionalProperties: true }
    ReportRequest:
      type: object
      required: [engagement_id, finding_ids]
      properties:
        engagement_id: { type: string }
        finding_ids: { type: array, items: { type: string } }
    RemediationRequest:
      type: object
      required: [finding_id, owner, plan, due_at]
      properties:
        finding_id: { type: string }
        owner: { type: string }
        plan: { type: string }
        due_at: { type: string, format: date-time }
