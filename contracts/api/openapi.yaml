openapi: 3.0.3
info:
  title: ANGEL Simulation Control Plane
  version: 0.1.0
  description: Contract boundary for observe/simulate workflows; no live execution endpoints.
paths:
  /healthz:
    get:
      responses:
        '200':
          description: Service health
  /v1/simulation/tasks:
    post:
      summary: Submit a fixture-backed simulation task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../task/task.schema.json'
      responses:
        '202':
          description: Simulation accepted
        '400':
          description: Invalid contract
        '403':
          description: Scope or approval denied
