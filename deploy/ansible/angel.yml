- name: Deploy ANGEL control plane lab
  hosts: angel
  become: true
  vars:
    angel_image: "angel-control-plane:latest"
    angel_container: "angel-control-plane"
  tasks:
    - name: Ensure ANGEL data directory exists
      ansible.builtin.file:
        path: /var/lib/angel
        state: directory
        owner: 65532
        group: 65532
        mode: "0750"

    - name: Run ANGEL control plane container
      community.docker.docker_container:
        name: "{{ angel_container }}"
        image: "{{ angel_image }}"
        restart_policy: unless-stopped
        user: "65532:65532"
        published_ports:
          - "127.0.0.1:8001:8001"
        volumes:
          - /var/lib/angel:/data
        read_only: true
        cap_drop:
          - ALL
        security_opts:
          - no-new-privileges:true
        tmpfs:
          - "/tmp:rw,noexec,nosuid,size=16m"
