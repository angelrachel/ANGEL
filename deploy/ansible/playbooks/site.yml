---
- name: Configure all ANGEL nodes
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name:
          - curl
          - wget
          - git
          - python3
          - python3-pip
          - wireguard
          - nginx
          - ufw
        state: present

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Allow HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Set timezone to UTC
      timezone:
        name: UTC

    - name: Create ANGEL user
      user:
        name: angel
        state: present
        shell: /bin/bash
        create_home: yes
