events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        location / {
            root /var/www/decoy;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /c2/ {
            proxy_pass https://10.0.0.2:443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /admin/ {
            proxy_pass https://10.0.0.3:443;
            proxy_set_header Host $host;
            proxy_set_header X-Operator-Key $http_x_operator_key;
        }

        location /login {
            return 404;
        }
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/angel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/angel.com/privkey.pem;

        location / {
            root /var/www/decoy;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /c2/ {
            proxy_pass https://10.0.0.2:443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /admin/ {
            proxy_pass https://10.0.0.3:443;
            proxy_set_header Host $host;
            proxy_set_header X-Operator-Key $http_x_operator_key;
        }
    }
}
