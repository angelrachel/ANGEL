events {}

http {
    limit_req_zone $binary_remote_addr zone=angel_api:10m rate=10r/s;
    upstream angel_control_plane {
        server angel:8000;
    }

    server {
        listen 8080;
        server_name _;
        server_tokens off;

        location = /healthz {
            proxy_pass http://angel_control_plane;
        }

        location / {
            limit_req zone=angel_api burst=20 nodelay;
            limit_except GET HEAD POST PUT PATCH DELETE OPTIONS { deny all; }
            proxy_pass http://angel_control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }
    }
}
