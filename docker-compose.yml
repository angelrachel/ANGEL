services:
  angel:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      ANGEL_ENV: ${ANGEL_ENV:-development}
      ANGEL_HOST: 0.0.0.0
      ANGEL_PORT: 8001
      ANGEL_DATABASE: /data/c2.db
      ANGEL_OPERATOR_KEY: ${ANGEL_OPERATOR_KEY:?ANGEL_OPERATOR_KEY must be set}
      ANGEL_SHARED_KEY: ${ANGEL_SHARED_KEY:?ANGEL_SHARED_KEY must be set}
      ANGEL_AUTH_SECRET: ${ANGEL_AUTH_SECRET:?ANGEL_AUTH_SECRET must be set}
    volumes:
      - angel-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
volumes:
  angel-data:
